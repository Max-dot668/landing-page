<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Roast & Crumb</title>
</head>
<body>
    <!-- Header Section -->
    <div class="header">
        <div class="logo">
            Roast & Crumb <i class="fa-solid fa-seedling"></i>
        </div>
        <div class="navigation">
            <ul>
                <li>Menu</li>
                <li>Our Story</li>
                <li>Locations</li>
                <li>Order Online</li>
            </ul>
        </div>
    </div>
    <!-- Hero Section -->
     <div class="hero">
        <div class="hero-content">
            <div class="main-text">
                Freshly baked pastries and artisanal coffee, made for your morning routine.
            </div>
            <div class="secondary-text">
                Step into a cozy atmosphere where every bean is ethically sourced and every croissant is laminated by hand from scratch daily. Come taste the difference.
            </div>
            <div class="btn-container">
                <button id="hero-btn">Order Ahead</button>
            </div>
        </div>
        <div class="hero-img">            
            <img id="coffee-img" src="assets/coffee-and-bakery-kubranur-cakiroglu.jpg" alt="aesthetic image of a latte served with croissants on a light background">
        </div>
     </div>
</body>
</html>
